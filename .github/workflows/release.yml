name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: Scripts/build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Soju.app "build/Soju-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Soju-*.zip
          generate_release_notes: true
